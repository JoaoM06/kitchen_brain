[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic", ".venv"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort
select = ["E", "F", "I", "W"]
# E501 (linha longa) fica a cargo do formatador; não falha o lint.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F811"]
