name: CI

on:
  pull_request:
    branches: [desenvolvimento, homologacao]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Os testes usam SQLite via conftest; estas variáveis só existem para o
      # Settings (pydantic-settings) instanciar e para o create_all do boot.
      DATABASE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: pytest -q

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        run: npm install
      - name: Lint (eslint)
        run: npx eslint .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
